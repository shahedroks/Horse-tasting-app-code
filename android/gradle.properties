org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Avoid Kotlin incremental cache bugs when Pub cache (C:) and project (D:) are on different drives.
kotlin.incremental=false
android.useAndroidX=true
# ar_flutter_plugin / Sceneform can pull legacy com.android.support; Jetifier maps them to AndroidX.
android.enableJetifier=true
